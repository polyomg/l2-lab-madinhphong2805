<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory by Category</title>
</head>
<body>
    <h1>TỒN KHO THEO LOẠI</h1>
    
    <table border="1" style="width:100%">
        <thead>
            <tr>
                <th>Loại hàng</th>
                <th>Tổng giá</th>
                <th>Số sản phẩm</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.group}"></td>
                <td th:text="${item.sum}"></td>
                <td th:text="${item.count}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search & Page</title>
</head>
<body>
    <h1>SEARCH & PAGE</h1>
    
    <form action="/product/search-and-page" method="post">
        <input name="keywords" th:value="${keywords}">
        <button>Search</button>
    </form>
    
    <table border="1" style="width:100%">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Price</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${page.content}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.price}"></td>
                <td th:text="${item.createDate}"></td>
            </tr>
        </tbody>
    </table>
    
    <div>
        <a th:href="@{|/product/search-and-page?p=0|}">First</a>
        <a th:href="@{|/product/search-and-page?p=${page.number - 1}|}">Previous</a>
        <a th:href="@{|/product/search-and-page?p=${page.number + 1}|}">Next</a>
        <a th:href="@{|/product/search-and-page?p=${page.totalPages - 1}|}">Last</a>
    </div>
    
    <div>
        <ul>
            <li>Số thực thể hiện tại: <span th:text="${page.numberOfElements}"></span></li>
            <li>Trang số: <span th:text="${page.number}"></span></li>
            <li>Kích thước trang: <span th:text="${page.size}"></span></li>
            <li>Tổng số thực thể: <span th:text="${page.totalElements}"></span></li>
            <li>Tổng số trang: <span th:text="${page.totalPages}"></span></li>
        </ul>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tính diện tích và chu vi hình chữ nhật</title>
    <style>
        
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Tính diện tích và chu vi hình chữ nhật</h2>
        <form action="/rectangle/calculate" method="post">
            <div class="form-group">
                <label for="width">Chiều rộng (cm):</label>
                <input type="number" id="width" name="width" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="length">Chiều dài (cm):</label>
                <input type="number" id="length" name="length" step="0.01" min="0" required>
            </div>
            <button type="submit">Tính toán</button>
        </form>
        
        <div th:if="${result}" class="result">
            <h3>Kết quả tính toán</h3>
            <p><strong>Chiều rộng:</strong> <span th:text="${width}"></span> cm</p>
            <p><strong>Chiều dài:</strong> <span th:text="${length}"></span> cm</p>
            <p><strong>Diện tích:</strong> <span th:text="${area}"></span> cm²</p>
            <p><strong>Chu vi:</strong> <span th:text="${perimeter}"></span> cm</p>
        </div>
        
        <div th:if="${error}" class="result">
            <p class="error" th:text="${error}"></p>
        </div>
    </div>
</body>
</html>

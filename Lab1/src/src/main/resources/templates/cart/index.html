<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert title here</title>
</head>
<body>
    <h1>Giỏ hàng</h1>
    
    <div th:if="${cart.items != null and !cart.items.isEmpty()}">
        <table border="1" style="width:100%">
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Amount</th>
                <th></th>
            </tr>
            <tr th:each="item: ${cart.items}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.price}"></td>
                <td>
                    <form th:action="@{|/cart/update/${item.id}|}" method="post" style="display: inline;">
                        <input type="hidden" name="id" th:value="${item.id}">
                        <input name="qty" th:value="${item.qty}" onblur="this.form.submit()" style="width: 50px;">
                    </form>
                </td>
                <td th:text="${item.price * item.qty}"></td>
                <td>
                    <a th:href="@{|/cart/remove/${item.id}|}">Remove</a>
                </td>
            </tr>
        </table>
    </div>
    <div th:if="${cart.items == null or cart.items.isEmpty()}">
        <p>Giỏ hàng trống</p>
    </div>
    
    <p><strong>Tổng số lượng:</strong> <span th:text="${cart.count != null ? cart.count : 0}"></span></p>
    <p><strong>Tổng tiền:</strong> <span th:text="${cart.amount != null ? cart.amount : 0.0}"></span></p>
    
    <p>
        <a href="/cart/clear">Clear Cart</a> | 
        <a href="/item/index">Add more</a>
    </p>
</body>
</html>
